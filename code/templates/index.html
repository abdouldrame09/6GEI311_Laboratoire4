<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Portail Tickets UQAC - Architecture REST (Lab 4)</title>
    <!-- Utilisation de Bootstrap via CDN  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-4" style="max-width: 950px;">
        <!-- En-tête -->
        <div class="mb-4 text-center">
            <h1 class="h3 fw-bold text-primary">Portail Tickets UQAC - Architecture REST (Lab 4)</h1>
            <p class="text-muted">Interface web simple connectée à l'API REST Flask</p>
        </div>

        <!-- Formulaire de creation -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white fw-bold">
                Créer un nouveau ticket
            </div>
            <div class="card-body">
                <form id="formTicket" onsubmit="creerTicket(event)">
                    <div class="mb-3">
                        <label for="titre" class="form-label fw-semibold">Titre du ticket :</label>
                        <input type="text" id="titre" class="form-control" required placeholder="ex: Erreur de connexion">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="utilisateur" class="form-label fw-semibold">Créateur :</label>
                            <select id="utilisateur" class="form-select"></select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="priorite" class="form-label fw-semibold">Priorité :</label>
                            <select id="priorite" class="form-select">
                                <option value="BASSE">BASSE</option>
                                <option value="NORMALE" selected>NORMALE</option>
                                <option value="HAUTE">HAUTE</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label fw-semibold">Description :</label>
                        <textarea id="description" class="form-control" rows="2" placeholder="Description du problème..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-success fw-bold">Créer le ticket</button>
                </form>
            </div>
        </div>

        <!-- Tableau des tickets -->
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <span class="fw-bold">Liste des tickets existants</span>
                <button type="button" class="btn btn-sm btn-light fw-bold" onclick="chargerTickets()">Actualiser</button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="table-secondary">
                            <tr>
                                <th style="width: 70px;">ID</th>
                                <th>Titre</th>
                                <th style="width: 110px;">Priorité</th>
                                <th style="width: 130px;">Statut</th>
                                <th>Créé par</th>
                                <th>Assigné à</th>
                            </tr>
                        </thead>
                        <tbody id="corpsTableau">
                            <tr>
                                <td colspan="6" class="text-center text-muted py-3">Chargement des tickets...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Script JavaScript pour appeler l'API REST -->
    <script>
        const API_URL = "/api";

        // Charger les utilisateurs dans la liste deroulante
        async function chargerUsers() {
            try {
                const reponse = await fetch(API_URL + "/users");
                const utilisateurs = await reponse.json();
                const selectUser = document.getElementById("utilisateur");
                
                selectUser.innerHTML = "";
                for (let i = 0; i < utilisateurs.length; i++) {
                    const u = utilisateurs[i];
                    selectUser.innerHTML += `<option value="${u.userId}">${u.name} (${u.email})</option>`;
                }
            } catch (erreur) {
                console.error("Erreur lors du chargement des utilisateurs :", erreur);
            }
        }

        // Charger les tickets depuis l'API REST et remplir le tableau
        async function chargerTickets() {
            try {
                const reponse = await fetch(API_URL + "/tickets");
                const tickets = await reponse.json();
                const corpsTableau = document.getElementById("corpsTableau");

                if (tickets.length === 0) {
                    corpsTableau.innerHTML = "<tr><td colspan='6' class='text-center text-muted py-3'>Aucun ticket trouvé.</td></tr>";
                    return;
                }

                let html = "";
                for (let i = 0; i < tickets.length; i++) {
                    const t = tickets[i];
                    const createur = t.createdBy ? t.createdBy.name : "Inconnu";
                    const assigne = t.assignedTo ? t.assignedTo.name : "Non assigné";

                    // Badge de couleur selon le statut
                    let badgeClass = "bg-secondary";
                    if (t.status === "OUVERT") badgeClass = "bg-success";
                    else if (t.status.includes("ASSIGNE")) badgeClass = "bg-primary";
                    else if (t.status === "VALIDATION") badgeClass = "bg-warning text-dark";
                    else if (t.status.includes("TERMINE")) badgeClass = "bg-secondary";

                    // Badge de priorite
                    let prioClass = "text-secondary";
                    if (t.priority === "HAUTE") prioClass = "text-danger fw-bold";
                    else if (t.priority === "BASSE") prioClass = "text-success";

                    html += `
                        <tr>
                            <td class="fw-bold">#${t.ticketId}</td>
                            <td>${t.title}</td>
                            <td class="${prioClass}">${t.priority}</td>
                            <td><span class="badge ${badgeClass}">${t.status}</span></td>
                            <td>${createur}</td>
                            <td>${assigne}</td>
                        </tr>
                    `;
                }

                corpsTableau.innerHTML = html;
            } catch (erreur) {
                document.getElementById("corpsTableau").innerHTML = 
                    `<tr><td colspan='6' class='text-center text-danger py-3'>Erreur de connexion avec l'API : ${erreur.message}</td></tr>`;
            }
        }

        // Creer un nouveau ticket via une requete POST
        async function creerTicket(event) {
            event.preventDefault();

            const titre = document.getElementById("titre").value.trim();
            const priorite = document.getElementById("priorite").value;
            const userId = parseInt(document.getElementById("utilisateur").value);
            const description = document.getElementById("description").value.trim();

            if (!titre) {
                alert("Veuillez renseigner un titre.");
                return;
            }

            try {
                const reponse = await fetch(API_URL + "/tickets", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        title: titre,
                        priority: priorite,
                        user_id: userId,
                        description_texte: description
                    })
                });

                if (reponse.ok) {
                    alert("Ticket créé avec succès !");
                    document.getElementById("titre").value = "";
                    document.getElementById("description").value = "";
                    chargerTickets();
                } else {
                    const err = await reponse.json();
                    alert("Erreur : " + (err.error || "Impossible de créer le ticket."));
                }
            } catch (erreur) {
                alert("Erreur réseau : " + erreur.message);
            }
        }

        // Chargement automatique au démarrage
        window.onload = function() {
            chargerUsers();
            chargerTickets();
        };
    </script>

</body>
</html>
